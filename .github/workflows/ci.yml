name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          activate-environment: dev

      - name: Format
        run: black --check src/

      - name: Imports
        run: isort --check src/

      - name: Types
        run: mypy src/

  test:
    strategy:
      matrix:
        python-version: ["py312", "py313"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          activate-environment: ${{ matrix.python-version }}

      - name: Test
        run: pytest ./src/
