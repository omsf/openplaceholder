[project]
name = "openplaceholder"
description = "an opionionated co-folding to FEP pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
]
maintainers = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
]
classifiers = [
	    "Intended Audience :: Science/Research",
	    "Operating System :: POSIX",
	    "Programming Language :: Python :: 3",
	    "Development Status :: 1 - Planning",
]
requires-python = ">=3.12"
dependencies = [
    "gufe",
    "MDAnalysis",
    "rdkit",
    "posebusters",
    "pdbfixer",
    "propka",
    "pdb2pqr",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "black",
    "isort",
    "mypy",
]
dev = [
    "openplaceholder[test]",
    "pdbpp"
]
docs = [
     "sphinx"
]

[build-system]
requires = [
    "setuptools",
    "versioningit",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
openplaceholder = ["./src/openplaceholder/tests/data/structures/*"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "v0.0.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
gufe = "*"
rdkit = "==2026.3.2"
prolif = ">=2.1"
pdbfixer = "*"
propka = "*"
pdb2pqr = "*"

[tool.pixi.pypi-dependencies]
openplaceholder = { path = ".", editable = true }
# the durrantlab dimorphite-dl rewrite (protonate_smiles API) is PyPI-only;
# conda-forge ships a different, older lineage. Its rdkit<2026 cap is a
# conservative upper bound (verified working with rdkit 2026.3.2), relaxed
# via the override below.
dimorphite-dl = "==2.0.2"

[tool.pixi.pypi-options.dependency-overrides]
rdkit = ">=2020.3.3"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.mmcif-pr.dependencies]
# mirrors the base [project.dependencies]/[tool.pixi.dependencies] minus
# MDAnalysis (overridden via pypi below) and prolif (which conda-pins an
# exact MDAnalysis version, conflicting with that override) -- this feature
# uses no-default-feature so it doesn't inherit those from the base feature.
gufe = "*"
rdkit = "==2026.3.2"
posebusters = "*"
gemmi = ">=0.7.3"

[tool.pixi.feature.mmcif-pr.pypi-dependencies]
openplaceholder = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
py312 = { features = ["test", "py312"], solve-group = "py312" }
py313 = { features = ["test", "py313"], solve-group = "py313" }
py314 = { features = ["test", "py314"], solve-group = "py314" }
# local-testing only: overrides MDAnalysis with an unmerged PR branch
# (https://github.com/MDAnalysis/mdanalysis/pull/4712) adding MMCIF support,
# pinned to a specific commit rather than the branch head. Can remove once PR
# is merged.
mmcif-pr = { features = ["test", "py312", "mmcif-pr"], no-default-feature = true }

[dependency-groups]
mmcif-pr = ["mdanalysis @ git+https://github.com/marinegor/mdanalysis.git@39bd4650f23e0a150948565f82afc2d669646103?rev_type=rev#subdirectory=package", "prolif>=2.2.0,<3"]
