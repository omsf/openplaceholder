[project]
name = "openplaceholder"
description = "an opionionated co-folding to FEP pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
  {name = "Jenke Scheen", email = "jenke.scheen@omsf.io"},
]
maintainers = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
  {name = "Jenke Scheen", email = "jenke.scheen@omsf.io"},
]
classifiers = [
	    "Intended Audience :: Science/Research",
	    "Operating System :: POSIX",
	    "Programming Language :: Python :: 3",
	    "Development Status :: 1 - Planning",
]
requires-python = ">=3.12"
dependencies = [
    "click",
    "gufe",
    "openfe",
    "MDAnalysis",
    "rdkit",
    "posebusters",
    "pdbfixer",
    "biotite",
    "hydride",
]
dynamic = ["version"]

[project.scripts]
oph = "openplaceholder.cli:cli"

[project.optional-dependencies]
test = [
    "black",
    "isort",
    "mypy",
    "pytest",
]
dev = [
    "openplaceholder[test]",
    "pdbpp",
    "flake8"
]
docs = [
     "sphinx"
]

[build-system]
requires = [
    "setuptools",
    "versioningit",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
openplaceholder = ["./src/openplaceholder/tests/data/structures/*"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "v0.0.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
click = "*"
openfe = ">=1.0"
gufe = "*"
rdkit = "*"
prolif = ">=2.1"
pdbfixer = "*"
biotite = "*"

[tool.pixi.pypi-dependencies]
openplaceholder = { path = ".", editable = true }
# the durrantlab dimorphite-dl rewrite (protonate_smiles API) is PyPI-only;
# conda-forge ships a different, older lineage. Its rdkit<2026 cap is a
# conservative upper bound (verified working with rdkit 2026.3.2), relaxed
# via the override below.
dimorphite-dl = "==2.0.2"
# protonate-utils' protein protonation engine. conda-forge only ships builds
# for older python ABIs (<=1.1.1) that conflict with the pinned python 3.12
# stack; the PyPI wheels (>=1.2) install cleanly. biotite stays on conda.
hydride = ">=1.2"

[tool.pixi.pypi-options.dependency-overrides]
rdkit = ">=2020.3.3"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
py312 = { features = ["test", "py312"], solve-group = "py312" }
py313 = { features = ["test", "py313"], solve-group = "py313" }
