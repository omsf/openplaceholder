[project]
name = "openplaceholder"
description = "an opionionated co-folding to FEP pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
]
maintainers = [
  {name = "Ian Kenney", email = "ian.kenney@choderalab.org"},
]
classifiers = [
	    "Intended Audience :: Science/Research",
	    "Operating System :: POSIX",
	    "Programming Language :: Python :: 3",
	    "Development Status :: 1 - Planning",
]
requires-python = ">=3.12"
dependencies = [
    "gufe",
    "MDAnalysis",
    "rdkit",
    "posebusters",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "black",
    "isort",
    "mypy",
]
dev = [
    "openplaceholder[test]",
    "pdbpp"
]
docs = [
     "sphinx"
]

[build-system]
requires = [
    "setuptools",
    "versioningit",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
openplaceholder = ["./src/openplaceholder/tests/data/structures/*"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "v0.0.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
gufe = "*"
rdkit = "==2026.3.2"

[tool.pixi.pypi-dependencies]
openplaceholder = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
